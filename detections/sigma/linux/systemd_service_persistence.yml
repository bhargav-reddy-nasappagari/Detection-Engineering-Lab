title: Suspicious systemd Service Persistence via Interpreter Execution
id: 8d7c6f9b-4c32-4a0e-b7d1-2d2c0d9e4f51
status: experimental
description: |
  Detects suspicious Linux persistence behavior through systemd services
  executing interpreters from writable or user-controlled paths.

  The detection focuses on behavioral correlation rather than specific
  service names. It identifies cases where systemd spawns interpreters
  such as bash, sh, python, perl, or php, particularly when execution
  originates from writable directories commonly abused for persistence.

  This detection aims to identify:
  - malicious systemd persistence
  - suspicious ExecStart behavior
  - daemon abuse through interpreters
  - attacker-controlled payload execution
  - resilient persistence mechanisms

references:
  - https://attack.mitre.org/techniques/T1543/002/
  - https://www.freedesktop.org/software/systemd/man/systemd.service.html
author: Bunny
date: 2026-05-25
modified: 2026-05-25
tags:
  - attack.persistence
  - attack.t1543.002
  - attack.execution
  - linux
  - systemd
  - behavior.persistence
  - detection.engineering

logsource:
  product: linux
  category: process_creation

detection:

  selection_parent_systemd:
    ParentImage|endswith:
      - '/systemd'
      - '/init'

  selection_interpreter_execution:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/dash'
      - '/python'
      - '/python3'
      - '/perl'
      - '/php'

  selection_writable_paths:
    CommandLine|contains:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm/'
      - '/home/'
      - '/run/user/'

  selection_service_artifacts:
    CommandLine|contains:
      - '.service'
      - 'ExecStart='

  optional_suspicious_keywords:
    CommandLine|contains:
      - 'Restart=always'
      - 'Restart=on-failure'

  filter_known_package_managers:
    Image|endswith:
      - '/apt'
      - '/apt-get'
      - '/dnf'
      - '/yum'
      - '/snap'
      - '/pacman'

  condition: >
    selection_parent_systemd
    and selection_interpreter_execution
    and (
      selection_writable_paths
      or selection_service_artifacts
    )
    and not filter_known_package_managers

falsepositives:
  - Developer-created test services
  - Internal automation scripts executed through systemd
  - Custom monitoring or maintenance agents
  - Administrative troubleshooting scripts
  - Legitimate startup wrappers using shell interpreters

level: high

fields:
  - Image
  - ParentImage
  - CommandLine
  - CurrentDirectory
  - User
  - ParentCommandLine
  - ProcessId
  - ParentProcessId
  - Hostname

related:
  - type: derived
    id: linux-systemd-service-creation

notes: |
  Detection Engineering Notes
  ---------------------------

  This rule intentionally avoids static IOC-based matching such as
  specific service names.

  The rule focuses on correlated behavioral indicators:

  - systemd spawning interpreters
  - writable-path execution
  - suspicious service execution behavior
  - persistence-oriented execution patterns

  High-confidence detection scenarios include:

  systemd -> bash -> /tmp/payload.sh
  systemd -> python -> /dev/shm/beacon.py

  The rule is designed to support:
  - ATT&CK-aligned analytics
  - behavioral detection engineering
  - Linux persistence detection
  - investigation-driven triage workflows

  Analysts should investigate:
  - service definitions
  - ExecStart paths
  - writable-directory payloads
  - journalctl logs
  - service ownership
  - persistence restart behavior
