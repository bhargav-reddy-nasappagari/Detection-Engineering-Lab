title: Linux Controlled Enumeration Pacing
id: 52f5f61a-controlled-pacing-linux
status: experimental

description: >
  Detects enumeration activity combined with sleep-based pacing,
  potentially indicating anti-detection behavior or scripted
  reconnaissance execution.

references:
  - https://attack.mitre.org/techniques/T1082/

author: Bunny
date: 2026-05-29

tags:
  - attack.discovery
  - linux
  - defense-evasion
  - scripted-execution

logsource:
  product: linux
  service: auditd
  category: process_creation

detection:

  selection_enum:
    CommandLine|contains:
      - 'whoami'
      - 'id'
      - 'uname'
      - 'ip a'
      - 'ps aux'

  selection_sleep:
    CommandLine|contains:
      - 'sleep '

  condition: selection_enum and selection_sleep

fields:
  - host.name
  - user.name
  - process.command_line
  - process.parent.command_line
  - process.pid
  - audit.session

falsepositives:
  - Shell automation scripts
  - Scheduled maintenance scripts
  - CI/CD orchestration

level: medium

