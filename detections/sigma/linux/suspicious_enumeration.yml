title: Linux Privilege Enumeration Following Discovery Activity
id: 19c0dc84-privilege-enum-correlation-linux
status: experimental

description: >
  Detects sudo privilege probing occurring after multiple
  Linux discovery commands inside the same session.

references:
  - https://attack.mitre.org/techniques/T1068/
  - https://attack.mitre.org/techniques/T1082/

author: Bunny
date: 2026-05-29

tags:
  - attack.discovery
  - attack.privilege_escalation
  - linux
  - sudo

logsource:
  product: linux
  service: auditd
  category: process_creation

detection:

  selection_enum:
    CommandLine|contains:
      - 'whoami'
      - 'id'
      - 'uname'
      - 'ip a'
      - 'ps aux'

  selection_sudo_probe:
    CommandLine|contains:
      - 'sudo -l'

  timeframe: 5m

  condition: selection_enum and selection_sudo_probe

fields:
  - host.name
  - user.name
  - process.command_line
  - process.parent.command_line
  - audit.session

falsepositives:
  - Legitimate administrator privilege validation
  - Security audits
  - DevOps troubleshooting

level: high

