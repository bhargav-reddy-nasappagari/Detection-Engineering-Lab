title: Linux Suspicious Enumeration Activity
id: 7f4a9f76-6e4d-4d0f-9f5b-structured-enum-linux
status: experimental

description: >
  Detects structured Linux enumeration behavior commonly associated
  with post-compromise reconnaissance activity. The rule identifies
  bursts of reconnaissance commands, privilege probing, and staged
  discovery behavior executed within a short time window.

references:
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1087/
  - https://attack.mitre.org/techniques/T1049/
  - https://attack.mitre.org/techniques/T1069/
  - https://attack.mitre.org/techniques/T1068/

author: Bunny
date: 2026-05-29

tags:
  - attack.discovery
  - attack.t1082
  - attack.t1087
  - attack.t1049
  - attack.t1069
  - attack.t1068
  - linux
  - reconnaissance
  - post-compromise

logsource:
  product: linux
  service: auditd
  category: process_creation

detection:

  #
  # Identity Enumeration
  #
  selection_identity:
    CommandLine|contains:
      - 'whoami'
      - 'id'
      - 'groups'

  #
  # System Discovery
  #
  selection_system:
    CommandLine|contains:
      - 'uname'
      - 'hostname'
      - 'cat /etc/os-release'

  #
  # User Discovery
  #
  selection_users:
    CommandLine|contains:
      - 'getent passwd'
      - 'who'
      - 'w '
      - 'last'

  #
  # Network Discovery
  #
  selection_network:
    CommandLine|contains:
      - 'ip a'
      - 'ip addr'
      - 'ifconfig'
      - 'ss -tulnp'
      - 'netstat'
      - 'ip route'

  #
  # Service Enumeration
  #
  selection_services:
    CommandLine|contains:
      - 'systemctl list-units'
      - 'service --status-all'

  #
  # Process Enumeration
  #
  selection_processes:
    CommandLine|contains:
      - 'ps aux'
      - 'pstree'
      - 'top'
      - 'htop'

  #
  # Privilege Enumeration
  #
  selection_privilege_probe:
    CommandLine|contains:
      - 'sudo -l'

  #
  # Interactive Shell Wrapping
  #
  selection_shell_wrapping:
    CommandLine|contains:
      - 'bash -i'
      - 'sh -i'

  #
  # Sleep / pacing indicators
  #
  selection_pacing:
    CommandLine|contains:
      - 'sleep '

  #
  # Correlation logic
  #
  condition: >
    (
      3 of selection_*
    )

fields:
  - _time
  - host.name
  - user.name
  - process.pid
  - process.parent.pid
  - process.command_line
  - process.executable
  - process.parent.command_line
  - audit.auid
  - audit.session
  - tty

falsepositives:
  - System administrators performing diagnostics
  - CI/CD automation scripts
  - Infrastructure inventory tooling
  - Security auditing activities
  - Configuration management frameworks
  - Troubleshooting sessions by privileged users

level: high

