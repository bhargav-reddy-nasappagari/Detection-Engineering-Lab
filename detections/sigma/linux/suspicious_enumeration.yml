title: Linux Enumeration Burst Activity
id: 8d2b0f91-22aa-4b0e-9ef6-linux-enum-burst
status: experimental

description: >
  Detects high-density execution of Linux enumeration commands
  within a short time window, indicating structured reconnaissance
  behavior after initial compromise.

references:
  - https://attack.mitre.org/techniques/T1082/

author: Bunny
date: 2026-05-29

tags:
  - attack.discovery
  - linux
  - reconnaissance
  - enumeration

logsource:
  product: linux
  service: auditd
  category: process_creation

detection:

  selection:
    CommandLine|contains:
      - 'whoami'
      - 'id'
      - 'uname'
      - 'hostname'
      - 'getent passwd'
      - 'ip a'
      - 'ss -tulnp'
      - 'systemctl list-units'
      - 'ps aux'
      - 'sudo -l'

  timeframe: 2m

  condition: selection

aggregation:
  - field: audit.session
    function: count
    value: 6

fields:
  - host.name
  - user.name
  - process.command_line
  - audit.session
  - tty

falsepositives:
  - Administrative maintenance
  - Automated inventory collection
  - Compliance scanning tools

level: high

