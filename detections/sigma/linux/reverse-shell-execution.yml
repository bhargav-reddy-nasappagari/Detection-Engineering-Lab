title: Linux Reverse Shell Execution Detection
id: 9f6b2f7d-8d73-4b1d-9f92-reverse-shell-linux
status: experimental
description: |
  Detects suspicious Linux reverse shell execution activity by identifying
  shell interpreters spawning network-capable utilities, suspicious reverse
  shell command-line syntax, and outbound callback behavior commonly associated
  with post-exploitation remote access.

references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1071/
  - https://attack.mitre.org/techniques/T1105/

author: Bunny
date: 2026-05-26

tags:
  - attack.execution
  - attack.command_and_scripting_interpreter
  - attack.t1059
  - attack.t1059.004
  - attack.command_and_control
  - attack.t1071
  - attack.t1105
  - linux
  - reverse_shell
  - post_exploitation

logsource:
  product: linux
  category: process_creation

detection:

  #
  # Shell interpreter execution
  #
  selection_shell:
    Image|endswith:
      - '/bash'
      - '/sh'

  #
  # Interactive shell indicators
  #
  selection_interactive:
    CommandLine|contains:
      - ' -i'
      - '/dev/tcp/'
      - '0>&1'
      - '>&'

  #
  # Netcat reverse shell patterns
  #
  selection_netcat:
    CommandLine|contains:
      - 'nc -e'
      - 'netcat -e'
      - 'ncat -e'

  #
  # FIFO / mkfifo reverse shell patterns
  #
  selection_fifo:
    CommandLine|contains:
      - 'mkfifo'
      - '/tmp/f'

  #
  # Python reverse shell indicators
  #
  selection_python:
    CommandLine|contains:
      - 'import socket'
      - 'subprocess'
      - 'os.dup2'
      - 'pty.spawn'

  #
  # Socat reverse shell indicators
  #
  selection_socat:
    CommandLine|contains:
      - 'socat TCP:'
      - 'EXEC:/bin/bash'
      - 'EXEC:/bin/sh'

  #
  # Suspicious networking utilities
  #
  selection_network_tools:
    CommandLine|contains:
      - ' nc '
      - ' curl '
      - ' wget '
      - ' socat '
      - ' openssl '
      - ' python '
      - ' perl '
      - ' php '

  #
  # Suspicious parent processes
  #
  selection_suspicious_parent:
    ParentImage|endswith:
      - '/apache2'
      - '/nginx'
      - '/php-fpm'
      - '/python'
      - '/perl'
      - '/cron'
      - '/systemd'

  #
  # High-risk outbound ports commonly seen in reverse shells
  #
  selection_common_ports:
    CommandLine|contains:
      - ' 4444'
      - ' 4445'
      - ' 5555'
      - ' 8080'
      - ' 9001'
      - ' 1337'

  #
  # Core behavioral detection logic
  #
  condition: >
    selection_shell and
    (
      selection_interactive or
      selection_netcat or
      selection_fifo or
      selection_python or
      selection_socat or
      selection_network_tools or
      selection_common_ports or
      selection_suspicious_parent
    )

falsepositives:
  - Administrative troubleshooting activity
  - Authorized penetration testing
  - Internal automation scripts
  - CI/CD execution pipelines
  - Developer debugging activity
  - Approved remote administration tooling

level: high

fields:
  - Image
  - CommandLine
  - ParentImage
  - User
  - PID
  - PPID
  - CurrentDirectory
  - Hostname
  - TerminalSessionId

taxonomy:
  category:
    - execution
    - command_and_control

metadata:
  simulation:
    name: Reverse Shell Execution
    repository: Detection-Engineering-Lab
    telemetry_sources:
      - auditd
      - Sysmon for Linux
      - EDR Process Telemetry
      - Linux Process Execution Logs

  detection_strategy:
    - shell_execution
    - shell_to_network_correlation
    - suspicious_process_lineage
    - reverse_shell_command_patterns
    - outbound_callback_behavior

  validation_requirements:
    - reverse shell execution observed
    - process lineage captured
    - outbound connection correlated
    - Sigma rule triggered successfully
    - detection artifacts generated

  attack_flow: |
    Shell Execution
        +
    Process Lineage
        +
    Outbound Network Activity
        +
    Suspicious Command Syntax

  notes: |
    This rule focuses on behavioral indicators commonly associated with Linux
    reverse shell activity. High-fidelity detection should correlate process
    execution telemetry with outbound network connection telemetry whenever
    possible.

    Port-based indicators alone should not be treated as conclusive evidence
    because attackers may use arbitrary ports.

    Detection fidelity improves significantly when shell execution,
    networking utilities, and outbound connections are correlated together.
