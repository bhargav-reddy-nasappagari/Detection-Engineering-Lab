title: SSH Brute Force Followed By Successful Authentication
id: a7e0c1b3-c2aa-44e0-8d5f-sshbf003
status: experimental
description: |
  Detects possible successful SSH brute force compromise where
  multiple authentication failures are followed by a successful
  SSH login from the same source IP.

references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1110/001/

author: Bunny
date: 2026/05/27
modified: 2026/05/27

tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
  - linux
  - ssh
  - brute_force
  - successful_compromise

logsource:
  product: linux
  service: sshd

detection:

  failed_auth:
    message|contains:
      - 'Failed password'
      - 'authentication failure'

  successful_auth:
    message|contains:
      - 'Accepted password'
      - 'Accepted publickey'

  timeframe: 10m

  condition: failed_auth followed_by successful_auth

fields:
  - timestamp
  - hostname
  - source.ip
  - user.name
  - message

falsepositives:
  - Users eventually remembering correct credentials
  - Password manager synchronization delays
  - Administrative troubleshooting activity

level: critical
title: SSH Brute Force Authentication Detection
id: 1f5d3c87-6b2a-4d91-8f3c-ssh-bruteforce-001
status: experimental

description: |
  Detects SSH brute force activity through behavioral correlation
  of repeated authentication failures, PAM authentication rejection
  telemetry, username guessing activity, and SSH daemon disconnect behavior.

  The detection logic was engineered from observed telemetry during
  SSH brute force simulation and validation exercises.

  Detection focuses on:
    - repeated SSH authentication failures
    - repeated attempts from same source IP
    - rapid authentication retry velocity
    - username guessing behavior
    - PAM authentication failures
    - SSH disconnect and pre-auth termination activity

references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1110/001/

author: Bunny
date: 2026/05/28
modified: 2026/05/28

tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
  - linux
  - ssh
  - brute_force
  - password_guessing
  - authentication
  - behavioral_detection

logsource:
  product: linux
  service: sshd

detection:

  failed_authentication:
    message|contains:
      - 'Failed password'
      - 'authentication failure'
      - 'Failed password for invalid user'
      - 'Failed password for user'
      - 'Invalid user'

  pam_authentication_failure:
    message|contains:
      - 'pam_unix(sshd:auth): authentication failure'
      - 'error: PAM: Authentication failure'

  ssh_disconnect_behavior:
    message|contains:
      - 'Connection closed by authenticating user'
      - 'Received disconnect from'
      - 'Disconnected from invalid user'
      - 'maximum authentication attempts exceeded'

  condition: failed_authentication
             or pam_authentication_failure
             or ssh_disconnect_behavior

fields:
  - timestamp
  - hostname
  - source.ip
  - destination.ip
  - user.name
  - event.outcome
  - process.name
  - process.pid
  - service.name
  - message

falsepositives:
  - Users repeatedly mistyping passwords
  - Outdated SSH credentials
  - Administrative SSH testing
  - SOC validation exercises
  - Broken automation scripts
  - CI/CD authentication failures
  - Misconfigured backup or monitoring services

level: medium

