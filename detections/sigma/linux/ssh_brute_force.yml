title: SSH Brute Force Threshold Correlation
id: 3f0d7e2a-7c5b-4d89-b1c4-sshbf002
status: experimental
description: |
  Detects probable SSH brute force activity by correlating repeated
  SSH authentication failures from the same source IP over a short
  period of time.

  This rule is intended for SIEM correlation engines capable of
  thresholding and aggregation logic.

references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1110/001/

author: Bunny
date: 2026/05/27
modified: 2026/05/27

tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
  - linux
  - ssh
  - brute_force
  - correlation

logsource:
  product: linux
  service: sshd

detection:

  selection:
    message|contains:
      - 'Failed password'
      - 'authentication failure'
      - 'Invalid user'

  timeframe: 5m

  condition: selection

aggregation:
  - field: source.ip
    function: count
    condition: gte
    value: 5

fields:
  - timestamp
  - hostname
  - source.ip
  - user.name
  - message

falsepositives:
  - Users repeatedly entering incorrect passwords
  - Internal password rotation issues
  - SSH automation failures
  - Administrative testing activity

level: high

