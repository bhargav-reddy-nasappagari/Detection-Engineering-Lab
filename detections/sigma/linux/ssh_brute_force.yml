title: SSH Brute Force Authentication Failures
id: 9d1d8d0f-9d91-4e5f-a5a2-sshbf001
status: experimental
description: |
  Detects potential SSH brute force activity by identifying repeated
  SSH authentication failures originating from the same source IP
  within a constrained timeframe.

  The rule focuses on behavioral correlation patterns associated with:
  - repeated failed SSH logins
  - invalid username attempts
  - PAM authentication failures
  - SSH daemon disconnect behavior
  - rapid authentication retry activity

references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1110/001/

author: Bunny
date: 2026/05/27
modified: 2026/05/27

tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
  - linux
  - ssh
  - brute_force
  - authentication

logsource:
  product: linux
  service: sshd

detection:

  failed_password:
    message|contains:
      - 'Failed password'
      - 'authentication failure'
      - 'Invalid user'
      - 'pam_unix(sshd:auth): authentication failure'
      - 'error: PAM: Authentication failure'

  disconnect_behavior:
    message|contains:
      - 'Connection closed by authenticating user'
      - 'Received disconnect from'
      - 'Disconnected from invalid user'
      - 'maximum authentication attempts exceeded'

  condition: failed_password or disconnect_behavior

fields:
  - timestamp
  - hostname
  - source.ip
  - user.name
  - process.name
  - process.pid
  - message

falsepositives:
  - User repeatedly mistyping passwords
  - Outdated SSH credentials
  - Administrative SSH testing
  - SOC validation activity
  - Broken automation scripts repeatedly attempting authentication
  - Misconfigured monitoring or backup services

level: medium

