title: SSH Username Guessing Detection
id: 9b3e5d1f-3d42-4a8f-95f1-ssh-bruteforce-003
status: experimental

description: |
  Detects SSH authentication attempts targeting multiple usernames
  from the same source IP within a short timeframe.

  This behavior may indicate:
    - username enumeration
    - password spraying
    - brute force reconnaissance activity

references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1110/001/

author: Bunny
date: 2026/05/28
modified: 2026/05/28

tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
  - linux
  - ssh
  - username_enumeration
  - password_spraying

logsource:
  product: linux
  service: sshd

detection:

  username_guessing:
    message|contains:
      - 'Invalid user'
      - 'Failed password for invalid user'

  common_targeted_users:
    message|contains:
      - 'root'
      - 'admin'
      - 'ubuntu'
      - 'test'

  timeframe: 5m

  condition: username_guessing and common_targeted_users

fields:
  - timestamp
  - source.ip
  - user.name
  - message

falsepositives:
  - User account testing
  - Administrative troubleshooting
  - SSH account validation activity

level: high

